<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Contas a Pagar</title></head>
<body>
    <h1>Controle de Contas a Pagar</h1>
    <a href="/">Voltar ao Início</a>
    <hr>

    <form method="POST">
        <label>Descrição da Conta (Ex: Fornecedor X, Aluguel):</label><br>
        <input type="text" name="descricao" required><br><br>

        <label>Valor (R$):</label><br>
        <input type="number" step="0.01" name="valor" required><br><br>

        <label>Data de Vencimento:</label><br>
        <input type="date" name="data_vencimento" required><br><br>

        <button type="submit">Adicionar Conta</button>
    </form>

    <h2>Lista de Contas</h2>
    <table border="1" cellpadding="5">
        <tr><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ação</th></tr>
        {% for c in contas %}
        <tr>
            <td>{{ c.descricao }}</td>
            <td>R$ {{ c.valor }}</td>
            <td>{{ c.data_vencimento }}</td>
            <td>{{ c.status }}</td>
            <td>
                {% if c.status == 'Pendente' %}
                    <a href="/pagar-conta/{{ c.id }}">Marcar como Pago</a>
                {% else %}
                    Quitado
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
